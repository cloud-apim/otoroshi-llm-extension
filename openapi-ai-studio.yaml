          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Budgets]
      operationId: deleteBudget
      summary: Deletes a budget
      x-ai-studio-ops:
        - { name: budgets.delete, access: 'config:write', audit: true }
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/budgets/{bid}/consumption:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
    get:
      tags: [Budgets]
      operationId: getBudgetConsumption
      summary: The consumption of the current cycle
      x-ai-studio-ops:
        - { name: budgets.consumption, access: 'config:read' }
      parameters:
        - $ref: '#/components/parameters/Consumer'
      responses:
        '200':
          $ref: '#/components/responses/ConsumptionView'
        '400':
          description: '`consumer_required`: the budget counts its consumers apart, `consumer` must name one'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The budget is not found, or nothing was consumed yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/budgets/{bid}/consumers:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
    get:
      tags: [Budgets]
      operationId: listBudgetConsumers
      summary: The consumers a budget "by consumer" counted in the current cycle
      description: The ones that consumed most first.
      x-ai-studio-ops:
        - { name: budgets.consumers, access: 'config:read' }
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: q
          in: query
          description: Keeps the consumers containing this text, case insensitive
          schema:
            type: string
      responses:
        '200':
          description: A page of consumers
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total:
                    type: integer
                    description: How many consumers match
                  items:
                    type: array
                    items:
                      type: object
                      required: [consumer, consumption]
                      properties:
                        consumer:
                          type: [string, 'null']
                          description: The email of the person
                        consumption:
                          $ref: '#/components/schemas/Consumption'
        '400':
          description: '`not_by_consumer`: the budget does not count its consumers apart'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/budgets/{bid}/consumption/_reset:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
    post:
      tags: [Budgets]
      operationId: resetBudgetConsumption
      summary: Resets the consumption of the current cycle
      description: Of one consumer when `consumer` names one, of every cycle with `all=true`.
      x-ai-studio-ops:
        - { name: budgets.reset, access: 'config:write', audit: true }
      parameters:
        - $ref: '#/components/parameters/Consumer'
        - name: all
          in: query
          description: Resets every cycle, not only the current one
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          description: '`consumer_not_allowed`: the budget does not count its consumers apart'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/budgets/{bid}/consumption/_extend:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/BudgetId'
    post:
      tags: [Budgets]
      operationId: extendBudget
      summary: Takes one of the extensions the budget allows
      description: |
        For a consumer when the budget counts its consumers apart: AI Studio Enterprise and the console relay here the
        one a person takes for themselves, the consumer forced on them (`mybudgets.extend`). A consumer takes one once
        it consumed in the cycle. The person AI Studio names in `AI-Studio-User-Email` is recorded in the audit event.
      x-ai-studio-ops:
        - { name: budgets.extend, access: 'config:write', audit: true }
        - { name: mybudgets.extend, access: 'usage:own', audit: true, own: budgets }
      parameters:
        - $ref: '#/components/parameters/Consumer'
        - name: AI-Studio-User-Email
          in: header
          description: The person taking the extension, recorded in the audit event
          schema:
            type: string
            format: email
      responses:
        '200':
          $ref: '#/components/responses/ConsumptionView'
        '400':
          description: '`consumer_required` or `consumer_not_allowed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller cannot write the budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`extensions_disabled` (the budget allows none), `no_consumption` (nothing consumed in the cycle yet) or `extensions_exhausted` (every extension of the cycle taken, `extensions_max` given)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Budgets]
      operationId: cancelBudgetExtensions
      summary: Cancels the extensions taken in the current cycle
      description: The amounts are removed, the number taken is kept, or cancelling then taking again would go past it.
      x-ai-studio-ops:
        - { name: budgets.unextend, access: 'config:write', audit: true }
      parameters:
        - $ref: '#/components/parameters/Consumer'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          description: '`consumer_required` or `consumer_not_allowed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  #################################################################################################
  # analytics
  #################################################################################################

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/analytics/_query:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Analytics]
      operationId: runAnalyticsQuery
      summary: Runs an llm or mcp query of the extension on the usage of the workspace
      description: |
        Always narrowed to the route and the tenant of the workspace, whatever the filters say. Served by the leader
        only, with an active user analytics exporter (PostgreSQL).
      x-ai-studio-ops:
        - { name: analytics.query, access: 'usage:own' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsQuery'
      responses:
        '200':
          description: The result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The workspace or the query is unknown, or this instance is not the leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: No active user analytics exporter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'


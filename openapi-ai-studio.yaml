openapi: 3.1.0
info:
  title: AI Studio API
  version: 1.0.0
  summary: Everything AI Studio needs from Otoroshi to run.
  description: |
    The api AI Studio runs on, whatever the edition: the OSS studio served by the LLM extension, AI Studio Enterprise
    and the Cloud APIM console all drive the same Otoroshi through it.

    **The studio admin api** (`/api/extensions/cloud-apim/extensions/ai-extension/studio`) is served by the LLM
    extension on the Otoroshi admin api. It is the only code building the entities of a workspace: a workspace is an
    Otoroshi route with its team, and every provider, model, api key, budget, preset, tool or MCP server of it is an
    Otoroshi entity tagged with the workspace. It exchanges views, never raw entities: what a page shows, and the form
    it sends back.

    - It can be called with an admin api key (`Otoroshi-Client-Id` / `Otoroshi-Client-Secret` headers, or basic auth),
      which is what AI Studio Enterprise and the console do with their service account, or through the backoffice
      (`/bo/api/proxy`) with the session of a backoffice user, which is what the OSS studio does.
    - Every entity read or written is checked against the rights of the caller, the way the generic admin api checks
      them: the `otoroshi-access-rights` metadata of an api key (none means no restriction), the rights of the
      backoffice user for a relayed call. What a caller cannot read does not exist for it (404), what it cannot write
      is refused (403). `Otoroshi-Tenant` is the tenant the caller works in.
    - Who can read the route of a workspace reads it, chats and sees its usage; who can write it does everything
      else. The view of a workspace gives these rights as AI Studio `permissions`.

    **Forms.** A field absent from a body keeps the current value, `null` clears it. Numbers are also read from
    numeric strings, booleans from `"true"` / `"false"`. A secret shown masked (AI Studio Enterprise masks them)
    comes back as `__ai_studio_secret__`, which stands for the value already stored.

    **Operations.** The pages of AI Studio do not call routes, they run operations
    (`ui/ai-studio/src/core/ops.js`): each one names the AI Studio permission it needs and the route serving it.
    `x-ai-studio-ops` lists the operations each route serves, `x-ai-studio-backend` the other calls of the backend of
    the front (`ui/ai-studio/src/lib/backend.js`). Several operations can share a route: AI Studio
    Enterprise checks a different permission for them (`keys.get` and `keys.reveal`), or narrows what they return to
    the person calling (`own`). `audit` marks the writes AI Studio Enterprise records, `reveals` an answer giving a
    secret masked everywhere else, `secretOnce` the creation or reset of a secret, the only time it is given unmasked.

    **Chat.** The models of a workspace are called through its OpenAI compatible endpoint
    (`<base_url>/chat/completions`, ...). AI Studio calls it without an api key, on behalf of a user: the studio admin
    api relays a call for the user an `AI-Studio-User-Email` header names (`/workspaces/{id}/proxy/...`), the
    backoffice for the signed-in user. The usage, the budgets scoped to users and the audit events are the ones of
    that user.

    **The backoffice routes** (`/extensions/cloud-apim/extensions/ai-extension/studio`) only serve the OSS studio,
    with the backoffice session of its user: the values of the page, the chat of the signed-in user and their
    conversations. AI Studio Enterprise and the console keep the conversations in their own database.

    **Errors** are `{ error, error_description }` objects, `error` being a code (`bad_request`, `forbidden`,
    `not_found`, `conflict`, `internal_error`, ...). The calls relayed to a workspace answer the way the gateway does.
  contact:
    name: Cloud APIM
    email: contact@cloud-apim.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
externalDocs:
  description: Otoroshi LLM extension
  url: https://www.cloud-apim.com/fr/opensource/otoroshi-llm-extension

servers:
  - url: '{scheme}://{adminApiHost}'
    description: The Otoroshi admin api, with an admin api key
    variables:
      scheme:
        default: http
        enum: [http, https]
      adminApiHost:
        default: otoroshi-api.oto.tools:8080
  - url: '{scheme}://{backofficeHost}/bo/api/proxy'
    description: The Otoroshi admin api through the backoffice, with the session of a backoffice user
    variables:
      scheme:
        default: http
        enum: [http, https]
      backofficeHost:
        default: otoroshi.oto.tools:8080

security:
  - adminApiClientId: []
    adminApiClientSecret: []
  - adminApiBasic: []
  - backofficeSession: []

tags:
  - name: Information
    description: What the extension serves, and the providers a workspace can connect.
  - name: Workspaces
    description: A workspace is an Otoroshi route serving an OpenAI compatible endpoint, with its own team.
  - name: Providers
    description: One connection per provider, with an entity per capability it serves (text, embedding, image, audio, moderation, ocr, video, decision).
  - name: Model access and guardrails
    description: The same on every model of the workspace.
  - name: Routing
    description: The default provider, the fallbacks, the load balancers and the routers.
  - name: Presets
    description: System and trailing messages a chat can pick, attached to providers.
  - name: Tools
    description: Http functions, MCP connectors and search engines the models can call.
  - name: MCP server
    description: The MCP server of the workspace, served on `<base_url>/mcp` with the api keys of the models.
  - name: API keys
    description: The keys calling the endpoint of the workspace.
  - name: Budgets
    description: Dollar and token limits, always scoped to the workspace first.
  - name: Analytics
    description: The usage of the workspace, from the Otoroshi user analytics.
  - name: Chat
    description: The endpoint of a workspace, called on behalf of a user.
  - name: Backoffice
    description: The routes only the OSS studio calls, with the backoffice session of its user.

paths:

  #################################################################################################
  # information
  #################################################################################################

  /api/extensions/cloud-apim/extensions/ai-extension/studio/_info:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [Information]
      operationId: getInfo
      summary: The version of the extension, its features and the exposure of the workspaces
      description: A client built against this api checks the features it needs before starting (AI Studio Enterprise refuses to start without them).
      responses:
        '200':
          description: The information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/catalog:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [Information]
      operationId: getCatalog
      summary: The provider kinds a workspace can connect
      description: What the "bring your own key" form needs for each kind, with what the gateway knows of its models (`insights`).
      x-ai-studio-backend: catalog
      responses:
        '200':
          description: The catalog, sorted by label
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'

  #################################################################################################
  # workspaces
  #################################################################################################

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces:
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: The workspaces the caller can read
      x-ai-studio-backend: workspaces.list
      responses:
        '200':
          description: The workspaces, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Creates a workspace
      description: |
        Creates the team of the workspace (`team_ai_studio_<id>`), then its route (`route_ai_studio_<id>`) in the tenant
        of the caller. A caller who is not an admin of the tenant also puts it in the teams it can write, so it still
        sees what it creates. Two workspaces never share a slug, whoever can see them: they would answer on the same
        domain.
      x-ai-studio-backend: workspaces.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: A workspace
      x-ai-studio-ops:
        - { name: workspace.get, access: 'workspace:read' }
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Updates a workspace
      description: The same as `PATCH`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          $ref: '#/components/responses/WorkspaceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [Workspaces]
      operationId: patchWorkspace
      summary: Updates a workspace
      description: An empty body repairs a route created by an earlier studio (`needs_repair`).
      x-ai-studio-ops:
        - { name: workspace.update, access: 'config:write', audit: true }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          $ref: '#/components/responses/WorkspaceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Deletes a workspace and everything in it
      description: The route first, so nothing is served while the rest is removed, then its api keys, budgets, models, presets, MCP server and tools, then its team.
      x-ai-studio-ops:
        - { name: workspace.delete, access: 'workspace:delete', audit: true }
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/models:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceModels
      summary: The models the endpoint of the workspace serves
      description: |
        Every model of every provider and model entity the route serves, with the ids a request names: the model
        alone when the modality has a single entity, `<provider slug>/<model>` otherwise, `<provider slug>###<model>`
        when the model has a slash of its own. Each model carries what the gateway knows of it (`metadata`).
      x-ai-studio-ops:
        - { name: models.list, access: 'workspace:read' }
      parameters:
        - $ref: '#/components/parameters/Force'
      responses:
        '200':
          description: The providers and their models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceModels'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  #################################################################################################
  # providers
  #################################################################################################

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/providers:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Providers]
      operationId: listProviders
      summary: The providers of the workspace
      description: 'Load balancers and routers are not providers: see the routing.'
      x-ai-studio-ops:
        - { name: providers.list, access: 'config:read' }
      responses:
        '200':
          description: The providers, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Providers]
      operationId: createProvider
      summary: Connects a provider
      description: |
        Creates an entity per capability enabled (the text one by default, the first capability of a provider without
        text otherwise), and serves them on the route of the workspace. A new provider is given every tool of the
        workspace, unless `tools` says otherwise. A decision model answered by a text provider (`llm-emulation`) names
        that provider in `fields.provider`.
      x-ai-studio-ops:
        - { name: providers.create, access: 'config:write', audit: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '201':
          description: The provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/providers/_models:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Providers]
      operationId: listDraftProviderModels
      summary: The models of a provider being edited, before it is saved
      description: |
        From a fresh connection of `kind`, or from the saved provider `connection_id` (its token and settings are used
        unless the body gives others). Every model is listed, the ones with no known price included.
      x-ai-studio-ops:
        - { name: providers.draftModels, access: 'config:write' }
      parameters:
        - $ref: '#/components/parameters/Force'
        - $ref: '#/components/parameters/Enriched'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftModelsRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProviderModels'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ProviderModelsError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/providers/{cid}:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProviderId'
    get:
      tags: [Providers]
      operationId: getProvider
      summary: A provider
      x-ai-studio-ops:
        - { name: providers.get, access: 'config:read' }
      responses:
        '200':
          $ref: '#/components/responses/ConnectionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Providers]
      operationId: updateProvider
      summary: Updates a provider
      description: A capability turned off deletes its entity, one turned on creates it. The kind of a provider never changes.
      x-ai-studio-ops:
        - { name: providers.update, access: 'config:write', audit: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ConnectionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Providers]
      operationId: deleteProvider
      summary: Deletes a provider and the entities of its capabilities
      x-ai-studio-ops:
        - { name: providers.delete, access: 'config:write', audit: true }
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/providers/{cid}/models:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProviderId'
    get:
      tags: [Providers]
      operationId: listProviderModels
      summary: The models a saved provider serves
      description: Listed by the provider itself, kept in cache, and filtered by the model access of the provider and its known costs requirement.
      x-ai-studio-ops:
        - { name: providers.models, access: 'config:read' }
      parameters:
        - $ref: '#/components/parameters/Force'
        - $ref: '#/components/parameters/Enriched'
      responses:
        '200':
          $ref: '#/components/responses/ProviderModels'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ProviderModelsError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/model-entities:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Providers]
      operationId: listModelEntities
      summary: Every model entity of the workspace
      description: Load balancers and routers included, the way a guardrail, a preset, a tool or a router refers to them (by entity id). What the pickers offer.
      x-ai-studio-ops:
        - { name: modelEntities.list, access: 'config:read' }
      responses:
        '200':
          description: The entities, by modality then by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  #################################################################################################
  # model access and guardrails
  #################################################################################################

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/model-access:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Model access and guardrails]
      operationId: getModelAccess
      summary: The models the workspace lets through
      x-ai-studio-ops:
        - { name: modelAccess.get, access: 'config:read' }
      responses:
        '200':
          $ref: '#/components/responses/ModelAccessView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Model access and guardrails]
      operationId: saveModelAccess
      summary: Sets the models the workspace lets through, on every model entity
      x-ai-studio-ops:
        - { name: modelAccess.save, access: 'config:write', audit: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelAccessWrite'
      responses:
        '200':
          $ref: '#/components/responses/ModelAccessView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/guardrails:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Model access and guardrails]
      operationId: getGuardrails
      summary: The guardrails of the workspace
      x-ai-studio-ops:
        - { name: guardrails.get, access: 'config:read' }
      responses:
        '200':
          $ref: '#/components/responses/GuardrailsView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Model access and guardrails]
      operationId: saveGuardrails
      summary: Sets the guardrails of the workspace, on every text provider
      description: A guardrail judged by a text model (`prompt_injection`, `pif`, `secrets_leakage`, `moderation`, `toxic_language`, `gibberish`) is given the first text provider of the workspace when its config names none.
      x-ai-studio-ops:
        - { name: guardrails.save, access: 'config:write', audit: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardrailsWrite'
      responses:
        '200':
          $ref: '#/components/responses/GuardrailsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  #################################################################################################
  # routing
  #################################################################################################

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/routing:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Routing]
      operationId: getRouting
      summary: The routing of the workspace
      x-ai-studio-ops:
        - { name: routing.get, access: 'config:read' }
      responses:
        '200':
          $ref: '#/components/responses/RoutingView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Routing]
      operationId: saveRouting
      summary: Sets the default provider and the fallbacks
      x-ai-studio-ops:
        - { name: routing.save, access: 'config:write', audit: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingWrite'
      responses:
        '200':
          $ref: '#/components/responses/RoutingView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/load-balancers:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Routing]
      operationId: listLoadBalancers
      summary: The load balancers of the workspace
      x-ai-studio-ops:
        - { name: balancers.list, access: 'config:read' }
      responses:
        '200':
          description: The load balancers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoadBalancer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Routing]
      operationId: createLoadBalancer
      summary: Creates a load balancer, served by the workspace as a provider
      description: Without `targets`, it balances the first two providers of the workspace.
      x-ai-studio-ops:
        - { name: balancers.create, access: 'config:write', audit: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadBalancerWrite'
      responses:
        '201':
          description: The load balancer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadBalancer'

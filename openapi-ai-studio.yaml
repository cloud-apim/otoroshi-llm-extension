          $ref: '#/components/responses/ProxyError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/proxy/decisions:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserEmail'
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/EmbedCosts'
    post:
      tags: [Chat]
      operationId: proxyDecisions
      summary: Asks a decision model, with the decisions api of OpenAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAiRequest'
      responses:
        '200':
          $ref: '#/components/responses/GatewayJson'
        default:
          $ref: '#/components/responses/ProxyError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/proxy/mcp:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserEmail'
      - $ref: '#/components/parameters/UserName'
    post:
      tags: [Chat]
      operationId: proxyMcp
      summary: A JSON-RPC request on the MCP server of the workspace
      description: The server answers a client that never initializes, so a single request needs no session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  const: '2.0'
                id:
                  type: [integer, string]
                method:
                  type: string
                  examples: [tools/list, tools/call]
                params:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: The JSON-RPC answer, or a stream of events whose last message is the answer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '404':
          description: The workspace serves no MCP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        default:
          $ref: '#/components/responses/ProxyError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/proxy/models:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserEmail'
      - $ref: '#/components/parameters/UserName'
    get:
      tags: [Chat]
      operationId: proxyModels
      summary: The OpenAI listing of the models the workspace serves
      parameters:
        - name: enriched
          in: query
          description: Adds a `_metadata` object to each model
          schema:
            type: boolean
        - name: kind
          in: query
          description: Keeps the models of at least one of these types (repeatable, comma separated)
          schema:
            type: string
            examples: ['image,video']
        - name: endpoint
          in: query
          description: Keeps the models served on at least one of these endpoints (repeatable, comma separated)
          schema:
            type: string
            examples: ['chat_completions,responses']
        - name: has_cost
          in: query
          description: Keeps the models costs tracking can (or cannot) bill
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GatewayJson'
        default:
          $ref: '#/components/responses/ProxyError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/proxy/contexts:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserEmail'
      - $ref: '#/components/parameters/UserName'
    get:
      tags: [Chat]
      operationId: proxyContexts
      summary: The presets the workspace serves
      responses:
        '200':
          description: The presets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        default:
          $ref: '#/components/responses/ProxyError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/proxy/providers:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserEmail'
      - $ref: '#/components/parameters/UserName'
    get:
      tags: [Chat]
      operationId: proxyProviders
      summary: Every provider kind the gateway supports, with its capabilities
      parameters:
        - name: capabilities
          in: query
          description: Keeps the providers exposing all of these capabilities (repeatable, comma separated)
          schema:
            type: string
            examples: ['text,image']
      responses:
        '200':
          $ref: '#/components/responses/GatewayJson'
        default:
          $ref: '#/components/responses/ProxyError'

  /api/extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/proxy/model-capabilities:
    parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserEmail'
      - $ref: '#/components/parameters/UserName'
    get:
      tags: [Chat]
      operationId: proxyModelCapabilities
      summary: The model types the gateway supports, each with the provider kinds exposing it
      responses:
        '200':
          $ref: '#/components/responses/GatewayJson'
        default:
          $ref: '#/components/responses/ProxyError'

  #################################################################################################
  # backoffice (the OSS studio)
  #################################################################################################

  /extensions/cloud-apim/extensions/ai-extension/studio/bootstrap:
    servers:
      - url: '{scheme}://{backofficeHost}'
        description: The Otoroshi backoffice, with the session of its user
        variables:
          scheme:
            default: http
            enum: [http, https]
          backofficeHost:
            default: otoroshi.oto.tools:8080
    get:
      tags: [Backoffice]
      operationId: getBootstrap
      summary: The values the page of the studio is served with
      description: Injected in the page served by the extension (`window.__AI_STUDIO__`); fetched from here by a page served by another server (the vite dev server).
      security:
        - backofficeSession: []
      responses:
        '200':
          description: The values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/proxy/{endpoint}:
    servers:
      - url: '{scheme}://{backofficeHost}'
        description: The Otoroshi backoffice, with the session of its user
        variables:
          scheme:
            default: http
            enum: [http, https]
          backofficeHost:
            default: otoroshi.oto.tools:8080
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: endpoint
        in: path
        required: true
        description: |
          Everything after `/proxy/`, slashes included and not encoded: the same endpoints as the chat of the studio
          admin api (`chat/completions`, `responses`, `open-responses`, `oai-responses`, `messages`, `embeddings`,
          `images/generations`, `images/edits`, `audio/speech`, `audio/transcriptions`, `audio/translations`,
          `moderations`, `ocr`, `systemone`, `decisions`, `mcp`, `models`, `contexts`, `providers`,
          `model-capabilities`), with the same bodies and answers.
        schema:
          type: string
          examples: [chat/completions]
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/EmbedCosts'
    get:
      tags: [Backoffice]
      operationId: backofficeProxyGet
      summary: The endpoint of a workspace, for the signed-in user
      description: Who can read the workspace can call it. The usage, the budgets scoped to users and the audit events are the ones of the signed-in user.
      security:
        - backofficeSession: []
      responses:
        '200':
          $ref: '#/components/responses/GatewayJson'
        default:
          $ref: '#/components/responses/ProxyError'
    post:
      tags: [Backoffice]
      operationId: backofficeProxyPost
      summary: The endpoint of a workspace, for the signed-in user
      description: Who can read the workspace can call it. The body is relayed as it comes.
      security:
        - backofficeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAiRequest'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/GatewayJsonOrStream'
        default:
          $ref: '#/components/responses/ProxyError'

  /extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/conversations:
    servers:
      - url: '{scheme}://{backofficeHost}'
        description: The Otoroshi backoffice, with the session of its user
        variables:
          scheme:
            default: http
            enum: [http, https]
          backofficeHost:
            default: otoroshi.oto.tools:8080
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Backoffice]
      operationId: listConversations
      summary: The conversations of the signed-in user in a workspace
      description: Kept in Redis, or in PostgreSQL when the danger zone says so (`conversations_store`).
      x-ai-studio-backend: urls.conversations
      security:
        - backofficeSession: []
      responses:
        '200':
          description: The conversations, the most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ConversationsStoreError'

  /extensions/cloud-apim/extensions/ai-extension/studio/workspaces/{id}/conversations/{cid}:
    servers:
      - url: '{scheme}://{backofficeHost}'
        description: The Otoroshi backoffice, with the session of its user
        variables:
          scheme:
            default: http
            enum: [http, https]
          backofficeHost:
            default: otoroshi.oto.tools:8080
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: cid
        in: path
        required: true
        description: The id of the conversation, chosen by the studio
        schema:
          type: string
    get:
      tags: [Backoffice]
      operationId: getConversation
      summary: A conversation
      security:
        - backofficeSession: []
      responses:
        '200':
          $ref: '#/components/responses/ConversationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The workspace or the conversation is not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                additionalProperties: true
        '500':
          $ref: '#/components/responses/ConversationsStoreError'
    put:
      tags: [Backoffice]
      operationId: saveConversation
      summary: Saves a conversation
      description: Stored as it comes, with the id of the path and the time of the save (`updated_at`).
      security:
        - backofficeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conversation'
      responses:
        '200':
          $ref: '#/components/responses/ConversationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ConversationsStoreError'
    delete:
      tags: [Backoffice]
      operationId: deleteConversation
      summary: Deletes a conversation
      security:
        - backofficeSession: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ConversationsStoreError'

  /bo/api/me/preferences/{key}:
    servers:
      - url: '{scheme}://{backofficeHost}'
        description: The Otoroshi backoffice, with the session of its user
        variables:
          scheme:
            default: http
            enum: [http, https]
          backofficeHost:
            default: otoroshi.oto.tools:8080
    parameters:
      - name: key
        in: path
        required: true
        description: The preference, `ai_studio_theme` for the theme of the studio
        schema:
          type: string
          examples: [ai_studio_theme]
    post:
      tags: [Backoffice]
      operationId: setPreference
      summary: Keeps a preference of the backoffice user
      description: An Otoroshi route. The studio keeps its theme there, which the page is served with.
      x-ai-studio-backend: prefs.set
      security:
        - backofficeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A json value, `"light"`, `"dark"` or `"system"` for the theme
      responses:
        '200':
          description: The value kept
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  securitySchemes:
    adminApiClientId:
      type: apiKey
      in: header
      name: Otoroshi-Client-Id
      description: The client id of an admin api key, with `Otoroshi-Client-Secret`
    adminApiClientSecret:
      type: apiKey
      in: header
      name: Otoroshi-Client-Secret
      description: The client secret of an admin api key, with `Otoroshi-Client-Id`
    adminApiBasic:
      type: http
      scheme: basic
      description: '`<client id>:<client secret>` of an admin api key'
    backofficeSession:
      type: apiKey
      in: cookie
      name: otoroshi-session
      description: The session of a backoffice user (`play.http.session.cookieName`, `otoroshi-session` by default)

  parameters:
    Tenant:
      name: Otoroshi-Tenant
      in: header
      description: The tenant the caller works in
      schema:
        type: string
        default: default
    WorkspaceId:
      name: id
      in: path
      required: true
      description: The id of the workspace
      schema:
        type: string
        examples: [v4e46mctfxxw]
    ProviderId:
      name: cid
      in: path
      required: true
      description: The id of the provider (its connection, `conn_...`)
      schema:
        type: string
    ApikeyId:
      name: kid
      in: path
      required: true
      description: The client id of the api key
      schema:
        type: string
    BudgetId:
      name: bid
      in: path
      required: true
      description: The id of the budget
      schema:
        type: string
    LoadBalancerId:
      name: lid
      in: path
      required: true
      description: The id of the load balancer (a provider entity)
      schema:
        type: string
    RouterId:
      name: rid
      in: path
      required: true
      description: The id of the router (a provider entity)
      schema:
        type: string
    PresetId:
      name: pid
      in: path
      required: true
      description: The id of the preset (a prompt context entity)
      schema:
        type: string
    ToolKind:
      name: kind
      in: path
      required: true
      description: The kind of tool
      schema:
        $ref: '#/components/schemas/ToolKind'
    ToolId:
      name: tid
      in: path
      required: true
      description: The id of the tool
      schema:
        type: string
    Force:
      name: force
      in: query
      description: Asks the providers again instead of reading their models from the cache
      schema:
        type: boolean
    Enriched:
      name: enriched
      in: query
      description: Adds what the gateway knows of each model (`details`)
      schema:
        type: boolean
    Consumer:
      name: consumer
      in: query
      description: A consumer of a budget counting its consumers apart (`by_consumer`), the email of the person
      schema:
        type: string
    UserEmail:
      name: AI-Studio-User-Email
      in: header
      required: true
      description: |
        The user the call is made for: its usage, the budgets scoped to users and the audit events are the ones of
        this user. Naming someone else attributes calls to them, which only who can write the workspace can do.
      schema:
        type: string
        format: email
    UserName:
      name: AI-Studio-User-Name
      in: header
      description: The name of the user, URL encoded (the email by default)
      schema:
        type: string
    SessionId:
      name: X-Session-Id
      in: header
      description: Groups the calls of one conversation in the logs
      schema:
        type: string
    EmbedCosts:
      name: embed_costs
      in: query
      description: Puts the price of the call in the answer (`costs`), whatever the instance is set to
      schema:
        type: boolean

  responses:
    Unauthorized:
      description: No valid admin api key, or no backoffice session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The body or a parameter is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller cannot write what this call writes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not readable by the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The name or the slug is already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Something failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Done:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [done]
            properties:
              done:
                const: true
    WorkspaceView:
      description: The workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workspace'
    ConnectionView:
      description: The provider
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Connection'
    ProviderModels:
      description: The models of the provider
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderModels'
    ProviderModelsError:
      description: The provider could not list its models
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                const: bad_gateway
              error_description:
                type: string
                description: Why, in words (`the provider rejected the credentials, check the API key`, ...)
              error_details:
                description: What the provider answered
    ModelAccessView:
      description: The model access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelAccess'
    GuardrailsView:
      description: The guardrails
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Guardrails'
    RoutingView:
      description: The routing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Routing'
    LoadBalancerView:
      description: The load balancer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadBalancer'
    RouterView:
      description: The router
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Router'
    PresetView:
      description: The preset
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Preset'
    ToolView:
      description: The tool
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Tool'
    McpServerView:
      description: The MCP server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/McpServer'
    ApikeyView:
      description: The api key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Apikey'
    BudgetView:
      description: The budget
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Budget'
    ConsumptionView:
      description: The consumption of the current cycle
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Consumption'
    ConversationView:
      description: The conversation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conversation'
    ConversationsStoreError:
      description: The conversations store failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayJson:
      description: The answer of the gateway
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    GatewayJsonOrStream:
      description: The answer of the gateway, or its events with `stream`
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        text/event-stream:
          schema:
            type: string
    ImagesAnswer:
      description: The images
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    b64_json:
                      type: string
                    url:
                      type: string
                  additionalProperties: true
              usage:
                type: object
                additionalProperties: true
              costs:
                $ref: '#/components/schemas/Costs'
            additionalProperties: true
    TextAnswer:
      description: The text
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
            additionalProperties: true
    ProxyError:
      description: |
        A call the gateway refused or failed: `400` (no `AI-Studio-User-Email`, or not an email), `403` (the caller
        cannot write the workspace, or the workspace is disabled), `404` (no such workspace or endpoint), a budget
        exceeded (`budget_exceeded: true`), a guardrail denial, or the error of the provider with its status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A code
          examples: [bad_request, forbidden, not_found, conflict, internal_error, consumer_required]
        error_description:
          type: string
      additionalProperties: true

    GatewayError:
      type: object
      description: The OpenAI shape (`error.message`) for the providers, the Otoroshi one (`error` a code, `error_details` what happened) for the other errors.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message:
                  type: string
              additionalProperties: true
        error_description:
          type: string
        error_details: {}
        budget_exceeded:
          type: boolean
      additionalProperties: true

    Modality:
      type: string
      enum: [text, embedding, image, audio, moderation, ocr, video, decision]

    Permission:
      type: string
      description: |
        What a user can do on a workspace. Who can read its route gets `workspace:read`, `chat:use`, `usage:own`,
        `config:read` and `activity:read`; who can write it gets them all but `members:read` and `members:manage`,
        which AI Studio Enterprise gives itself.
      enum:
        - 'workspace:read'
        - 'chat:use'
        - 'keys:own'
        - 'usage:own'
        - 'config:read'
        - 'activity:read'
        - 'config:write'
        - 'keys:manage'
        - 'members:read'
        - 'members:manage'
        - 'workspace:delete'

    Period:
      type: string
      description: '`custom` is the period of a budget whose duration was set outside of the studio: it is kept, never set'
      enum: [lifetime, daily, weekly, monthly, yearly, custom]

    #################################################################################################
    # information
    #################################################################################################

    StudioConfig:
      type: object
      description: The settings of AI Studio, from the danger zone of Otoroshi
      required: [enabled, domain, exposure, route_path, public_scheme, public_port, default_throttling_quota, default_daily_quota, default_monthly_quota, conversations_store]
      properties:
        enabled:
          type: boolean
        domain:
          type: string
          description: The domain the workspaces are served on
          examples: [oto.tools]
        exposure:
          type: string
          description: '`subdomain`: `<slug>.<domain><route_path>`, `path`: `<domain>/<slug><route_path>`'
          enum: [subdomain, path]
        route_path:
          type: string
          examples: [/v1]
        public_scheme:
          type: string
          examples: [https]
        public_port:
          type: string
          description: '`:<port>`, empty for 80 and 443'
          examples: [':8080', '']
        default_throttling_quota:
          type: integer
          format: int64
        default_daily_quota:
          type: integer
          format: int64
        default_monthly_quota:
          type: integer
          format: int64
        conversations_store:
          type: string
          enum: [redis, postgresql]

    Info:
      type: object
      required: [version, features, config]
      properties:
        version:
          type: string
          description: The build of the extension, `dev` when it does not run from its jar
        features:
          type: array
          description: |
            What this api offers beyond the routes of its first version: `caller-rights`, `budget-consumers`,
            `budget-extensions`, `proxy-on-behalf-of`, `providers-draft-models`, `provider-options`, `model-entities`,
            `tools-listing`, `mcp-server-meta`, `workspace-permissions`, `secret-sentinel`.
          items:
            type: string
        config:
          $ref: '#/components/schemas/StudioConfig'

    CatalogField:
      type: object
      description: A connection setting of a provider kind
      required: [name, label, placeholder, default, kind]
      properties:
        name:
          type: string
        label:
          type: string
        placeholder:
          type: string
        default:
          type: string
        kind:
          type: string
          description: '`provider`: a text provider of the workspace'
          enum: [text, provider]

    CatalogProvider:
      type: object
      required: [id, label, capabilities, base_url, base_url_required, token_required, credentials, models, audio_modes, fields, openai_like]
      properties:
        id:
          type: string
          description: The provider kind
          examples: [openai]
        label:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Modality'
        base_url:
          type: [string, 'null']
        base_url_required:
          type: boolean
        token_required:
          type: boolean
        credentials:
          type: boolean
          description: False for a connection that reaches nothing by itself and goes through another one
        models:
          type: object
          description: The suggested model of each capability, the audio one split in `audio_tts` and `audio_stt`
          additionalProperties:
            type: string
        audio_modes:
          type: array
          items:
            type: string
            enum: [tts, stt]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CatalogField'
        openai_like:
          type: boolean
        insights:
          $ref: '#/components/schemas/ProviderInsights'

    ProviderInsights:
      type: object
      description: What the models catalog knows of the models of a provider kind, empty when it knows none
      properties:
        provider:
          type: string
        name:
          type: string
        doc:
          type: string
          format: uri
        models:
          type: integer
        kinds:
          type: object
          description: How many models of each type
          additionalProperties:
            type: integer
        reasoning:
          type: integer
        tool_call:
          type: integer
        vision:
          type: integer
        priced:
          type: integer
          description: How many models costs tracking bills
        prompt_from:
          type: string
          description: The cheapest input price of its text models, in dollars per token
        prompt_to:
          type: string
        max_context:
          type: integer

    #################################################################################################
    # workspaces
    #################################################################################################

    Workspace:
      type: object
      required: [id, name, description, enabled, slug, base_url, tenant, route_id, team_id, mcp_server_ref, needs_repair, permissions, settings]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        slug:
          type: string
          description: The name of the workspace in its domain
        base_url:
          type: string
          format: uri
          description: Where the workspace is served, `/chat/completions` and the other endpoints under it
          examples: ['https://acme.oto.tools/v1']
        tenant:
          type: string
        route_id:
          type: string
          examples: [route_ai_studio_v4e46mctfxxw]
        team_id:
          type: string
          examples: [team_ai_studio_v4e46mctfxxw]
        mcp_server_ref:
          type: [string, 'null']
          description: The MCP server the route serves on `<base_url>/mcp`
        needs_repair:
          type: boolean
          description: A route created by an earlier studio, which an empty `PATCH` repairs
        permissions:
          type: array
          description: What the caller can do on the workspace
          items:
            $ref: '#/components/schemas/Permission'
        settings:
          $ref: '#/components/schemas/WorkspaceSettings'

    WorkspaceSettings:
      type: object
      required: [call_timeout, global_timeout, max_size_upload, decode_images, allowed_ip_addresses, blocked_ip_addresses]
      properties:
        call_timeout:
          type: integer
          format: int64
          description: Milliseconds
          default: 600000
        global_timeout:
          type: integer
          format: int64
          description: Milliseconds
          default: 600000
        max_size_upload:
          type: integer
          format: int64
          description: Bytes
          default: 104857600
        decode_images:
          type: boolean
        allowed_ip_addresses:
          type: array
          description: Only these addresses call the workspace, when there is one
          items:
            type: string
        blocked_ip_addresses:
          type: array
          items:
            type: string

    WorkspaceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        slug:
          type: string
          description: Made of the name when absent, lower case letters, digits and dashes, 48 characters at most

    WorkspaceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        slug:
          type: string
        enabled:
          type: boolean
        call_timeout:
          type: integer
        global_timeout:
          type: integer
        max_size_upload:
          type: integer
        decode_images:
          type: boolean
        allowed_ip_addresses:
          type: [array, 'null']
          items:
            type: string
        blocked_ip_addresses:
          type: [array, 'null']
          items:
            type: string

    ModelMetadata:
      type: object
      description: What the gateway knows of a model, from the models catalog and the price table it bills with
      properties:
        kinds:
          type: array
          description: Its Otoroshi model types
          items:
            $ref: '#/components/schemas/Modality'
        has_cost:
          type: boolean
          description: Whether costs tracking can bill its calls
        openai_compatible:
          type: boolean
        endpoints:
          type: array
          description: The OpenAI endpoints it is served on
          items:
            type: string
            examples: [chat_completions, responses, embeddings, images_generations, images_edits, audio_speech, audio_transcriptions, audio_translations, moderations, ocr, videos, systemone, decisions]
        mode:
          type: string
        capabilities:
          type: object
          properties:
            reasoning:
              type: boolean
            reasoning_options:
              type: array
              items: {}
            tool_call:
              type: boolean
            structured_output:
              type: boolean
            temperature:
              type: boolean
            attachment:
              type: boolean
            prompt_caching:
              type: boolean
            web_search:
              type: boolean
        modalities:
          type: object
          properties:
            input:
              type: array
              items:
                type: string
            output:
              type: array
              items:
                type: string
        limits:
          type: object
          properties:
            context:
              type: integer
            input:
              type: integer
            output:
              type: integer
        pricing:
          $ref: '#/components/schemas/Pricing'
        knowledge:
          type: string
        status:
          type: string
        deprecation_date:
          type: string
        sources:
          type: object
          properties:
            catalog:
              type: object
              properties:
                provider:
                  type: string
                model:
                  type: string
                match:
                  type: string
                  enum: [exact, normalized, approximate, global, global-approximate]
            pricing:
              type: object
              properties:
                source:
                  type: string
                model:
                  type: string
                currency:
                  type: string
                exchange_rate:
                  type: number
      additionalProperties: true

    Pricing:
      type: object
      description: The prices it is billed with, in dollars per token (per image, second or character for the others), as strings
      properties:
        prompt:
          type: string
        completion:
          type: string
        input_cache_read:
          type: string
        input_cache_write:
          type: string
        internal_reasoning:
          type: string
        audio:
          type: string
        audio_output:
          type: string
        image:
          type: string
        image_output:
          type: string
        input_second:
          type: string
        output_second:
          type: string
        input_character:
          type: string
        video_second:
          type: string

    WorkspaceModelSource:
      type: object
      description: A provider or a model entity the workspace serves
      required: [id, modality]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
        modality:
          $ref: '#/components/schemas/Modality'
        default_model:
          type: [string, 'null']
        endpoints:
          type: array
          items:
            type: string
        error:
          type: string
          description: Why its models could not be listed (its default model is listed instead)
        error_details: {}

    WorkspaceModel:
      type: object
      required: [id, model, provider, provider_id, provider_kind, modality, created, owned_by, owned_by_with_model, metadata]
      properties:
        id:
          type: string
          description: What a request names
          examples: [openai/gpt-4o-mini, 'openrouter###openai/gpt-4o-mini']
        model:
          type: string
        provider:
          type: string
          description: The slug of the provider
        provider_id:
          type: string
        provider_kind:
          type: string
        modality:
          $ref: '#/components/schemas/Modality'
        created:
          type: integer
          format: int64
        owned_by:
          type: string
        owned_by_with_model:
          type: string
          description: How the model is shown, `<provider name> / <model>`
        metadata:
          $ref: '#/components/schemas/ModelMetadata'

    WorkspaceModels:
      type: object
      required: [providers, models]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceModelSource'
        models:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceModel'

    #################################################################################################
    # providers
    #################################################################################################

    ModalityConf:
      type: object
      required: [enabled, model]
      properties:
        enabled:
          type: boolean
        model:
          type: string
          description: Its default model (the voice of the audio capability)
        stt_model:
          type: string
          description: The transcription model, audio only

    Connection:
      type: object
      description: A provider of the workspace
      required: [id, name, kind, description, enabled, require_known_costs, base_url, token, timeout, fields, modalities, entities, tools, options]
      properties:
        id:
          type: string
          examples: [conn_x1y2z3a4b5c6]
        name:
          type: string
          description: The prefix of its models (`<name>/<model>`), lower case letters, digits and underscores
        kind:
          type: string
          description: A provider kind of the catalog
        description:
          type: string
        enabled:
          type: boolean
        require_known_costs:
          type: boolean
          description: The models the gateway cannot bill are refused and not listed
        base_url:
          type: string
        token:
          type: string
          description: Secret, masked by AI Studio Enterprise
          x-ai-studio-secret: true
        timeout:
          type: number
          description: Milliseconds
        fields:
          type: object
          description: The extra settings of its kind (see `fields` in the catalog)
          additionalProperties: true
        modalities:
          type: object
          description: Its capabilities
          propertyNames:
            $ref: '#/components/schemas/Modality'
          additionalProperties:
            $ref: '#/components/schemas/ModalityConf'
        entities:
          type: object
          description: The id of the entity of each capability
          propertyNames:
            $ref: '#/components/schemas/Modality'
          additionalProperties:
            type: string
        tools:
          type: array
          description: The tools its text models can call
          items:
            type: string
        options:
          type: object
          description: The raw options of its text provider (temperature, max tokens...)
          additionalProperties: true

    ModalityPatch:
      oneOf:
        - type: boolean
        - type: object
          properties:
            enabled:
              type: boolean
              default: true
              description: A capability listed in a body is enabled unless it says `false`
            model:
              type: string
            stt_model:
              type: string

    ConnectionWrite:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        base_url:
          type: string
        token:
          type: string
          description: Required for a new provider whose kind says so
        timeout:
          type: number
        enabled:
          type: boolean
        require_known_costs:
          type: boolean
        fields:
          type: object
          additionalProperties: true
        modalities:
          type: object
          propertyNames:
            $ref: '#/components/schemas/Modality'
          additionalProperties:
            $ref: '#/components/schemas/ModalityPatch'
        tools:
          type: array
          description: The tools its text models can call, tools of the workspace only. Needs the text capability.
          items:
            type: string
        options:
          type: [object, 'null']
          description: The raw options of its text provider, `null` clears them
          additionalProperties: true

    ConnectionCreate:
      allOf:
        - $ref: '#/components/schemas/ConnectionWrite'
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              description: A provider kind of the catalog

    ConnectionUpdate:
      allOf:
        - $ref: '#/components/schemas/ConnectionWrite'
        - type: object
          properties:
            kind:
              type: string
              description: The kind of the provider, which never changes

    DraftModelsRequest:
      type: object
      description: '`kind` for a provider not saved yet, `connection_id` for a saved one'
      properties:
        kind:
          type: string
        connection_id:
          type: string
        base_url:
          type: string
        token:
          type: string
        fields:
          type: object
          additionalProperties: true

    ProviderModels:
      type: object
      required: [from_cache, models]
      properties:
        from_cache:
          type: boolean
        models:
          type: array
          items:
            type: string
        details:
          type: object
          description: With `enriched`, what the gateway knows of each model
          additionalProperties:
            $ref: '#/components/schemas/ModelMetadata'

    ModelEntity:
      type: object
      required: [id, name, modality, kind, model, connection, virtual, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        modality:
          $ref: '#/components/schemas/Modality'
        kind:
          type: string
        model:
          type: [string, 'null']
        connection:
          type: [string, 'null']
          description: The provider it belongs to
        virtual:
          type: boolean
          description: A load balancer or a router
        enabled:
          type: boolean

    #################################################################################################
    # model access and guardrails
    #################################################################################################

    ModelAccess:
      type: object
      required: [include, exclude, mixed]
      properties:
        include:
          type: array
          description: Regular expressions on the model names
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        mixed:
          type: boolean
          description: The model entities do not all have the same, the view shows the first one

    ModelAccessWrite:
      type: object
      properties:
        include:
          type: [array, 'null']
          items:
            type: string
        exclude:
          type: [array, 'null']
          items:
            type: string

    GuardrailKind:
      type: string
      enum: [regex, contains, characters, rampart, prompt_injection, pif, secrets_leakage, moderation, toxic_language, gibberish, moderation_model, decision_model, webhook]

    GuardrailFilter:
      type: object
      description: The calls a guardrail applies to, none meaning every call
      required: [from, value]
      properties:
        from:
          type: string
        value:
          type: string

    Guardrail:
      type: object
      required: [id, enabled, before, after, config, filters]
      properties:
        id:
          $ref: '#/components/schemas/GuardrailKind'
        enabled:
          type: boolean
          default: true
        before:
          type: boolean
          default: true
          description: Checks the request
        after:
          type: boolean
          default: false
          description: Checks the answer
        config:
          type: object
          description: |
            The settings of its kind, over its defaults. A guardrail judged by a text model names its `provider`, a
            `moderation_model` its `moderation_model`, a `decision_model` its `decision_model` and its `threshold`:
            models of the workspace only.
          additionalProperties: true
        filters:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailFilter'
      additionalProperties: true

    Guardrails:
      type: object
      required: [items, fail_on_deny, mixed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Guardrail'
        fail_on_deny:
          type: boolean
          description: A denied call fails with an error rather than answering the denial
        mixed:
          type: boolean
          description: The providers do not all have the same, the view shows the first one

    GuardrailsWrite:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '#/components/schemas/GuardrailKind'
              enabled:
                type: boolean
              before:
                type: boolean
              after:
                type: boolean
              config:
                type: object
                additionalProperties: true
              filters:
                type: array
                items:
                  $ref: '#/components/schemas/GuardrailFilter'
            additionalProperties: true
        fail_on_deny:
          type: boolean

    #################################################################################################
    # routing
    #################################################################################################

    Routing:
      type: object
      required: [default_provider, order, providers, load_balancers, routers]
      properties:
        default_provider:
          type: [string, 'null']
          description: The provider answering a request naming no model
        order:
          type: array
          items:
            type: string
        providers:
          type: array
          items:
            type: object
            required: [id, name, kind, model, fallback, chain]
            properties:
              id:
                type: string
              name:
                type: string
              kind:
                type: string
              model:
                type: [string, 'null']
              fallback:
                type: [string, 'null']
              chain:
                type: array
                description: The provider and the fallbacks it ends up on
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        load_balancers:
          type: array
          items:
            $ref: '#/components/schemas/LoadBalancer'
        routers:
          type: array
          items:
            $ref: '#/components/schemas/Router'

    RoutingWrite:
      type: object
      properties:
        default_provider:
          type: string
          description: A provider the workspace serves
        fallbacks:
          type: object
          description: The fallback of each provider, `null` or an empty string for none
          additionalProperties:
            type: [string, 'null']

    LoadBalancingStrategy:
      type: string
      enum: [round_robin, random, best_response_time]

    LoadBalancer:
      type: object
      required: [id, name, strategy, targets]
      properties:
        id:
          type: string
        name:
          type: string
        strategy:
          $ref: '#/components/schemas/LoadBalancingStrategy'
        targets:
          type: array
          items:
            type: object
            required: [ref, weight, model]
            properties:
              ref:
                type: string
              weight:
                type: number
              model:
                type: [string, 'null']
                description: Another model than the default one of the provider

    LoadBalancerWrite:
      type: object
      properties:
        name:
          type: string
          default: balanced
        strategy:
          $ref: '#/components/schemas/LoadBalancingStrategy'
        targets:
          type: array
          description: Providers of the workspace, load balancers and routers aside
          minItems: 1
          items:
            oneOf:
              - type: string
              - type: object
                required: [ref]
                properties:
                  ref:
                    type: string
                  weight:
                    type: number
                    default: 1
                  model:
                    type: string

    RouterMode:
      type: string
      enum: [code, auto, smart, intent, fusion]

    RouterCandidate:
      description: A provider of the workspace, with another model than its default one when it is an object
      oneOf:
        - type: string
        - type: object
          required: [ref, model]
          properties:
            ref:
              type: string
            model:
              type: string

    IntentCandidate:
      type: object
      description: A candidate of the intent router, as the user described it
      required: [ref]
      properties:
        ref:
          type: string
        model:
          type: string
        description:
          type: string
          description: What it is good at
        name:
          type: string
          description: The name of its option

    Router:
      type: object
      required: [id, name, modes]
      properties:
        id:
          type: string
        name:
          type: string
        modes:
          type: array
          description: The routing models it serves, the ones with candidates
          items:
            $ref: '#/components/schemas/RouterMode'
        code_router_refs:
          type: array
          items:
            $ref: '#/components/schemas/RouterCandidate'
        min_coding_score:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        auto_router_refs:
          type: array
          items:
            $ref: '#/components/schemas/RouterCandidate'
        auto_router_classifier_ref:
          type: [string, 'null']
        auto_router_classifier_model:
          type: [string, 'null']
        cost_quality_tradeoff:
          type: number
          minimum: 0
          maximum: 10
          default: 7
        allowed_models:
          type: array
          items:
            type: string
        decision_model_ref:
          type: [string, 'null']
          description: The decision model of the smart and intent routers
        decision_model_model:
          type: [string, 'null']
        smart_router_refs:
          type: array
          items:
            $ref: '#/components/schemas/RouterCandidate'
        smart_router_min_score:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        smart_router_max_score:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        intent_router_refs:
          type: array
          items:
            $ref: '#/components/schemas/IntentCandidate'
        intent_router_instructions:
          type: [string, 'null']
        intent_router_min_confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        fusion_router_refs:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/RouterCandidate'
        fusion_router_judge_ref:
          type: [string, 'null']
        fusion_router_judge_model:
          type: [string, 'null']
        fusion_router_synthesizer_ref:
          type: [string, 'null']
        fusion_router_synthesizer_model:
          type: [string, 'null']

    RouterWrite:
      type: object
      description: |
        A router needs candidates for at least one mode. Candidates given as ids keep the model already set for them,
        `{ ref, model }` objects set it, `null` clears a list. The scores are clamped to their range, the fusion keeps 8
        candidates at most.
      properties:
        name:
          type: string
          default: router
        code_router_refs:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RouterCandidate'
        min_coding_score:
          type: number
        auto_router_refs:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RouterCandidate'
        auto_router_classifier_ref:
          type: [string, 'null']
        auto_router_classifier_model:
          type: [string, 'null']
        cost_quality_tradeoff:
          type: number
        allowed_models:
          type: [array, 'null']
          items:
            type: string
        decision_model_ref:
          type: [string, 'null']
          description: A decision model of the workspace
        decision_model_model:
          type: [string, 'null']
        smart_router_refs:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RouterCandidate'
        smart_router_min_score:
          type: number
        smart_router_max_score:
          type: number
        intent_router_refs:
          type: [array, 'null']
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/IntentCandidate'
        intent_router_instructions:
          type: [string, 'null']
        intent_router_min_confidence:
          type: [number, 'null']
        fusion_router_refs:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RouterCandidate'
        fusion_router_judge_ref:
          type: [string, 'null']
        fusion_router_judge_model:
          type: [string, 'null']
        fusion_router_synthesizer_ref:
          type: [string, 'null']
        fusion_router_synthesizer_model:
          type: [string, 'null']

    #################################################################################################
    # presets
    #################################################################################################

    Preset:
      type: object
      required: [id, name, description, system, trailing, providers]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        system:
          type: string
          description: The system message put before the messages of a chat
        trailing:
          type: string
          description: The user message put after them
        providers:
          type: array
          description: The text providers it is attached to
          items:
            type: string

    PresetWrite:
      type: object
      properties:
        name:
          type: string
          description: Required on creation, spaces become dashes
        description:
          type: string
        system:
          type: string
        trailing:
          type: string
        providers:
          type: [array, 'null']
          items:
            type: string

    #################################################################################################
    # tools
    #################################################################################################

    ToolKind:
      type: string
      enum: [functions, mcp, search]

    SearchProvider:
      type: string
      enum: [tavily, brave, exa, searchapi, google, staan, searxng, duckduckgo]

    Tool:
      type: object
      description: The fields of a tool depend on its kind
      required: [id, name, description, providers]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        providers:
          type: array
          description: The text providers whose models can call it
          items:
            type: string
        parameters:
          type: object
          description: '`functions`: the json schema of its arguments'
          additionalProperties: true
        url:
          type: string
          description: '`functions`: the url called, `${arg}` replaced by the arguments; `mcp`: the url of the server'
        method:
          type: string
          description: '`functions`'
          default: POST
        headers:
          type: object
          description: '`functions` and `mcp`. Secret, masked by AI Studio Enterprise'
          additionalProperties:
            type: string
          x-ai-studio-secret: true
        body:
          type: string
          description: '`functions`'
        timeout:
          type: number
          description: '`functions` and `mcp`, milliseconds'
          default: 30000
        kreuzberg:
          type: boolean
          description: '`functions`: turns the document answered into markdown'
        transport:
          type: string
          description: '`mcp`'
          examples: [http_2026_07_28]
        enabled:
          type: boolean
          description: '`mcp`'
        search_provider:
          $ref: '#/components/schemas/SearchProvider'
        token:
          type: string
          description: '`search`. Secret, masked by AI Studio Enterprise'
          x-ai-studio-secret: true
        base_url:
          type: string
          description: '`search`'

    ListedTool:
      allOf:
        - $ref: '#/components/schemas/Tool'
        - type: object
          required: [kind]
          properties:
            kind:
              $ref: '#/components/schemas/ToolKind'

    ToolWrite:
      type: object
      description: The fields of its kind, `name` required, `url` required for a function and a connector
      properties:
        template:
          type: string
          description: Creates a ready-made http function, on creation only
          enum: [web_fetch]
        name:
          type: string
        description:
          type: string
        providers:
          type: [array, 'null']
          items:
            type: string
        parameters:
          type: [object, 'null']
          additionalProperties: true
        url:
          type: string
        method:
          type: string
          description: '`GET` when absent on creation'
        headers:
          type: [object, 'null']
          additionalProperties:
            type: string
        body:
          type: string
        timeout:
          type: number
        kreuzberg:
          type: boolean
        enabled:
          type: boolean
        search_provider:
          $ref: '#/components/schemas/SearchProvider'
        token:
          type: string
        base_url:
          type: string

    #################################################################################################
    # mcp server
    #################################################################################################

    McpServer:
      type: object
      required: [served, url, id, name, description, enabled, functions, connectors, expose_as_meta, meta_semantic_search]
      properties:
        served:
          type: boolean
          description: Whether the workspace serves one
        url:
          type: string
          format: uri
          description: '`<base_url>/mcp`'
        id:
          type: [string, 'null']
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        functions:
          type: array
          description: The http functions it exposes
          items:
            type: string
        connectors:
          type: array
          description: The MCP connectors whose tools it exposes
          items:
            type: string
        expose_as_meta:
          type: boolean
          description: The tools are exposed behind a few meta tools (list, search, schema, execute) instead of one by one
        meta_semantic_search:
          type: boolean

    McpServerWrite:
      type: object
      properties:
        name:
          type: string
          description: Required when the workspace serves none yet
        description:
          type: string
        enabled:
          type: boolean
        functions:
          type: [array, 'null']
          items:
            type: string
        connectors:
          type: [array, 'null']
          items:
            type: string
        expose_as_meta:
          type: boolean
        meta_semantic_search:
          type: boolean

    #################################################################################################
    # api keys
    #################################################################################################

    ModelPatterns:
      type: object
      description: Regular expressions on `model`, `provider/model` or `provider###model`, without commas
      required: [include, exclude]
      properties:
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string

    Quotas:
      type: object
      properties:
        throttling_quota:
          type: [integer, 'null']
          format: int64
          description: Calls per second
        daily_quota:
          type: [integer, 'null']
          format: int64
        monthly_quota:
          type: [integer, 'null']
          format: int64

    Apikey:
      type: object
      required: [client_id, client_secret, bearer, name, description, enabled, valid_until, expired, owner, models, uses_workspace_quotas, quotas, credit_limit]
      properties:
        client_id:
          type: string
        client_secret:
          type: [string, 'null']
          description: Secret, masked by AI Studio Enterprise but on creation, reset and reveal
          x-ai-studio-secret: true
        bearer:
          type: [string, 'null']
          description: The bearer token of the key. Secret, masked like the client secret
          x-ai-studio-secret: true
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        valid_until:
          type: [string, 'null']
          format: date-time
          description: When the key stops working
        expired:
          type: boolean
        owner:
          type: [string, 'null']
          format: email
          description: The person the usage of the key counts for, none for a key of the whole workspace
        models:
          $ref: '#/components/schemas/ModelPatterns'
        uses_workspace_quotas:
          type: boolean
          description: Its quotas are the defaults of AI Studio
        quotas:
          $ref: '#/components/schemas/Quotas'
        credit_limit:
          type: [object, 'null']
          description: The budget limiting the key
          required: [budget_id, usd, period]
          properties:
            budget_id:
              type: string
            usd:
              type: [number, 'null']
            period:
              $ref: '#/components/schemas/Period'

    ApikeyWrite:
      type: object
      properties:
        name:
          type: string
          description: Required on creation
        description:
          type: string
        enabled:
          type: boolean
        valid_until:
          description: An ISO-8601 instant, epoch milliseconds, or a date (valid through the end of that day, UTC), `null` for a key that never expires
          oneOf:
            - type: string
              examples: ['2027-01-31', '2027-01-31T18:00:00Z']
            - type: integer
            - type: 'null'
        owner:
          type: [string, 'null']
          format: email
          description: '`null` makes it a key of the whole workspace'
        models:
          description: '`null` for every model, a list left out is kept'
          oneOf:
            - type: object
              properties:
                include:
                  type: array
                  items:
                    type: string
                exclude:
                  type: array
                  items:
                    type: string
            - type: 'null'
        quotas:
          description: Overrides the defaults of AI Studio, `null` goes back to them
          oneOf:
            - $ref: '#/components/schemas/Quotas'
            - type: 'null'
        credit_limit:
          description: Sets the budget limiting the key, `null` removes it
          oneOf:
            - type: object
              properties:
                usd:
                  type: [number, 'null']
                period:
                  $ref: '#/components/schemas/Period'
            - type: 'null'

    #################################################################################################
    # budgets
    #################################################################################################

    BudgetRule:
      type: object
      description: A condition on the call, a json path and the value it must have
      required: [path, value]
      properties:
        path:
          type: string
          examples: ['$.apikey.metadata.team']
        value: {}

    Budget:
      type: object
      required: [id, name, description, enabled, usd, tokens, period, duration, mode, alert, scope, apikeys, users, models, rules, key_limit, start_at, end_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        usd:
          type: [number, 'null']
          description: The dollar limit of a cycle
        tokens:
          type: [number, 'null']
          description: The token limit of a cycle
        period:
          $ref: '#/components/schemas/Period'
        duration:
          type: [object, 'null']
          properties:
            value:
              type: integer
            unit:
              type: string
        mode:
          type: string
          description: '`block` refuses the calls once exceeded, `soft` only alerts'
          enum: [block, soft]
        alert:
          type: number
          description: The percentage alerting before the limit
          default: 80
        scope:
          type: string
          description: '`workspace`: every call of the workspace, `apikey`: one api key, `custom`: the api keys, users, models and rules given'
          enum: [workspace, apikey, custom]
        apikeys:
          type: array
          items:
            type: string
        users:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
        rules:
          type: array
          description: The conditions added to the one of the workspace, which is always there
          items:
            $ref: '#/components/schemas/BudgetRule'
        key_limit:
          type: [string, 'null']
          description: The api key it is the credit limit of
        start_at:
          type: [string, 'null']
          format: date-time
        end_at:
          type: [string, 'null']
          format: date-time
        by_consumer:
          type: boolean
          description: Each person gets the whole limit, their chats and the calls of the keys they own counting together. Absent when it counts nobody apart.
        partition:
          type: string
          description: Counted apart by an expression set outside of the studio, which the studio never changes
          enum: [custom]
        extensions_enabled:
          type: boolean
          description: Present with the extensions
        extension_usd:
          type: [number, 'null']
          description: What an extension adds to the dollar limit
        extension_tokens:
          type: [number, 'null']
        max_extensions:
          type: integer
          description: How many extensions a cycle allows
        consumption:
          $ref: '#/components/schemas/Consumption'
        consumers_count:
          type: integer
          description: For a budget "by consumer" listed with `consumption`, how many consumers it counted in the cycle

    BudgetWrite:
      type: object
      description: A budget needs a `usd` or a `tokens` limit.
      properties:
        name:
          type: string
          description: Required on creation
        description:
          type: string
        enabled:
          type: boolean
        usd:
          type: [number, 'null']
        tokens:
          type: [number, 'null']
        period:
          $ref: '#/components/schemas/Period'
        mode:
          type: string
          enum: [block, soft]
        alert:
          type: number
        scope:
          type: string
          description: Deduced from the consumers given when absent. `apikey` needs exactly one api key of the workspace.
          enum: [workspace, apikey, custom]
        apikeys:
          type: [array, 'null']
          items:
            type: string
        users:
          type: [array, 'null']
          items:
            type: string
        models:
          type: [array, 'null']
          items:
            type: string
        rules:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/BudgetRule'
        by_consumer:
          type: boolean
          description: Not for a budget scoped to an api key
        extensions_enabled:
          type: boolean
        extension_usd:
          type: [number, 'null']
          description: Positive, needs a dollar limit
        extension_tokens:
          type: [number, 'null']
          description: Positive, needs a token limit
        max_extensions:
          type: integer
          minimum: 1

    Consumption:
      type: object
      description: |
        What a cycle consumed, for every limit of a budget: `consumed_<limit>`, `remaining_<limit>` and
        `allowed_<limit>` (the limit with the extensions taken, `null` without limit), the limits being `total`,
        `inference`, `image`, `audio`, `video`, `embedding`, `moderation`, `ocr` and `decision`, in `usd` and in
        `tokens` (`pages` for the ocr).
      required: [consumed_total_usd, consumed_total_tokens, remaining_total_usd, remaining_total_tokens]
      properties:
        consumed_total_usd:
          type: number
        consumed_total_tokens:
          type: integer
        remaining_total_usd:
          type: number
        remaining_total_tokens:
          type: integer
        allowed_total_usd:
          type: [number, 'null']
        allowed_total_tokens:
          type: [integer, 'null']
        partition:
          type: string
          description: The consumer, for a budget counting its consumers apart
        extensions_taken:
          type: integer
          description: How many extensions the cycle took
        extensions_max:
          type: integer
        extension:
          type: object
          description: What an extension adds to each limit
          additionalProperties:
            type: number
      patternProperties:
        '^(consumed|remaining)_(total|inference|image|audio|video|embedding|moderation|ocr|decision)_(usd|tokens|pages)$':
          type: number
        '^allowed_(total|inference|image|audio|video|embedding|moderation|ocr|decision)_(usd|tokens|pages)$':
          type: [number, 'null']
        '^extra_(total|inference|image|audio|video|embedding|moderation|ocr|decision)_(usd|tokens|pages)$':
          type: number
          description: What the extensions taken in the cycle add to a limit

    #################################################################################################
    # analytics
    #################################################################################################

    AnalyticsQuery:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: An llm or mcp query of the extension
          pattern: '^cloudapim_(llm|mcp)_'
          examples: [cloudapim_llm_cost_over_time, cloudapim_llm_calls_log, cloudapim_mcp_tools_table]
        filters:
          type: object
          description: The route and the tenant of the workspace are always added
          properties:
            from:
              type: string
              description: '`now`, `now-<n><s|m|h|d>` or an ISO-8601 instant'
              default: now-1h
              examples: [now-7d, '2026-09-01T10:00:00.000Z']
            to:
              type: string
              default: now
            apikey_id:
              type: string
            err:
              type: boolean
              description: Only the calls that failed, or only the ones that did not
        params:
          type: object
          description: The parameters of the query (`user`, the email of a studio user, for every llm query; `limit`, `before` for the logs...)
          additionalProperties: true
        bucket:
          type: string
          description: The size of the buckets of a timeseries, chosen from the range when absent
          enum: [1m, 5m, 1h, 6h, 1d]
        compare:
          type: boolean
          description: Also runs the query on the previous period (`compare`)
        nocache:
          type: boolean

    AnalyticsResult:
      type: object
      required: [shape, data, meta]
      properties:
        shape:
          type: string
          enum: [timeseries, topN, pie, scalar, metric, table, heatmap]
        data:
          type: object
          description: '`{ value }` for a scalar, `{ points: [{ ts, value }] }` or `{ series: [{ name, points }] }` for a timeseries, `{ items, next }` for a log paged with `before`'
          additionalProperties: true
        raw:
          type: array
          items: {}
        meta:
          type: object
          properties:
            execution_ms:
              type: integer
            from_cache:
              type: boolean
            bucket:
              type: string
          additionalProperties: true
        compare:
          type: object
          description: The result on the previous period, with `compare`
          additionalProperties: true

    #################################################################################################
    # chat
    #################################################################################################

    Costs:
      type: object
      description: What the gateway billed for the call, with `embed_costs`
      properties:
        input_cost:
          type: number
        output_cost:
          type: number
        reasoning_cost:
          type: number
        total_cost:
          type: number
        currency:
          const: dollar
        source:
          type: string
      additionalProperties: true

    OpenAiRequest:
      type: object
      description: The body of the api, relayed as it is
      additionalProperties: true

    ChatMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          description: A text, or parts (text, images, files)
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: 'null'
      additionalProperties: true

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          description: An id of the models listing of the workspace
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
        temperature:
          type: number
        top_p:
          type: number
        max_tokens:
          type: integer
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    ChatCompletion:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
          description: The model that answered
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              finish_reason:
                type: [string, 'null']
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: [string, 'null']
                  reasoning:
                    type: string
                  reasoning_content:
                    type: string
                  reasoning_details:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  images:
                    type: array
                    description: What the model drew
                    items:
                      type: object
                      additionalProperties: true
                  tool_calls:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
            additionalProperties: true
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
              description: The reasoning tokens included
            total_tokens:
              type: integer
          additionalProperties: true
        costs:
          $ref: '#/components/schemas/Costs'
      additionalProperties: true

    AudioFileForm:
      type: object
      required: [model, file]
      properties:
        model:
          type: string
        file:
          type: string
          format: binary
      additionalProperties: true

    #################################################################################################
    # backoffice
    #################################################################################################

    Bootstrap:
      type: object
      required: [theme, basePath, adminUrl, apiPath, extensionId, user, config, otoroshi]
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        basePath:
          type: string
          examples: [/extensions/cloud-apim/ai-studio]
        adminUrl:
          type: string
          examples: [/bo/dashboard]
        apiPath:
          type: string
          examples: [/extensions/cloud-apim/extensions/ai-extension/studio]
        extensionId:
          type: string
          examples: [cloud-apim.extensions.LlmExtension]
        user:
          type: object
          required: [email, name, superAdmin, rights]
          properties:
            email:
              type: string
              format: email
            name:
              type: string
            superAdmin:
              type: boolean
            rights:
              type: array
              description: The rights of the backoffice user
              items:
                type: object
                additionalProperties: true
        config:
          $ref: '#/components/schemas/StudioConfig'
        otoroshi:
          type: object
          required: [version, domain]
          properties:
            version:
              type: string
            domain:
              type: string

    ConversationSummary:
      type: object
      required: [id, title, model, updated_at]
      properties:
        id:
          type: [string, 'null']
        title:
          type: [string, 'null']
        model:
          type: [string, 'null']
        updated_at:
          type: [integer, 'null']
          format: int64
          description: Epoch milliseconds

    Conversation:
      type: object
      description: |
        Stored as the studio writes it: a list of messages, an answer keeping its regenerated `versions`, a comparison
        (`compare`, the models of its columns) giving each turn of the assistant the `answers` of every column.
      properties:
        id:
          type: string
        title:
          type: string
        model:
          type: string
        compare:
          type: array
          maxItems: 3
          items:
            type: string
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
              reasoning:
                type: string
              model:
                type: string
              requested:
                type: string
              images:
                type: array
                items:
                  type: string
              attachments:
                type: array
                items:
                  type: object
                  additionalProperties: true
              usage:
                type: object
                additionalProperties: true
              costs:
                $ref: '#/components/schemas/Costs'
              duration:
                type: number
              ttft:
                type: number
              error:
                type: boolean
              stopped:
                type: boolean
              at:
                type: number
              versions:
                type: array
                items:
                  type: object
                  additionalProperties: true
              version:
                type: integer
              answers:
                type: array
                items:
                  type: object
                  additionalProperties: true
            additionalProperties: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
          description: Set by the store on each save
      additionalProperties: true
